<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailSetu · Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=26">
  <script src="/static/js/theme.js?v=1"></script>
  <script src="/static/js/i18n.js?v=3"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="brand-mark">
          <path d="M6 3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8" cy="13.5" r="1.4" fill="currentColor"/>
          <circle cx="16" cy="13.5" r="1.4" fill="currentColor"/>
          <path d="M7 17l-2 3M17 17l2 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Rail<strong>Setu</strong></span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link" data-i18n="nav.search">Search</a>
        <a href="/status/" class="nav-link" data-i18n="nav.status">Live status</a>
        <a href="/board/" class="nav-link" data-i18n="nav.board">Station board</a>
        <a href="/coaches/" class="nav-link" data-i18n="nav.coaches">Coaches</a>
        <a href="/predict/" class="nav-link" data-i18n="nav.predict">Predict</a>
        <a href="/dashboard/" class="nav-link" id="nav-dash" hidden>Dashboard</a>
        <select class="lang-select" id="lang-select" aria-label="Language"></select>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme"><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <a href="/account/" class="btn-ghost" id="signin-link">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="wrap dash-wrap">
    <div class="dash-top">
      <div>
        <h1 class="dash-title">Analytics</h1>
        <p class="dash-sub" id="dash-sub">Live overview of bookings, searches and model usage.</p>
      </div>
      <button type="button" class="dash-refresh" id="dash-refresh" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        Refresh
      </button>
    </div>

    <div class="state" id="dash-loading">Loading dashboard&hellip;</div>
    <div class="state" id="dash-error" hidden></div>

    <div id="dash-body" hidden>
      <section class="dash-cards" id="dash-cards"></section>

      <section class="dash-card dash-wide">
        <div class="dash-h"><span>Bookings, last 7 days</span></div>
        <div id="dash-last7"></div>
      </section>

      <section class="dash-row2">
        <div class="dash-card">
          <div class="dash-h"><span>Booking status mix</span></div>
          <div id="dash-status"></div>
        </div>
        <div class="dash-card">
          <div class="dash-h"><span>Bookings by class</span></div>
          <div id="dash-byclass"></div>
        </div>
      </section>

      <section class="dash-row2">
        <div class="dash-card">
          <div class="dash-h"><span>Top booked routes</span></div>
          <div id="dash-routes" class="dash-list"></div>
        </div>
        <div class="dash-card">
          <div class="dash-h"><span>Top searched routes</span></div>
          <div id="dash-searches" class="dash-list"></div>
        </div>
      </section>

      <section class="dash-card">
        <div class="dash-h"><span>ML model usage</span></div>
        <div id="dash-models" class="dash-models"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"><span>RailSetu</span></div>
  </footer>

  <script src="/static/js/auth.js?v=2"></script>
  <script src="/static/js/dashboard.js?v=2"></script>
</body>
</html>
