<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailSetu · Train schedule</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=33">
  <script src="/static/js/theme.js?v=1"></script>
  <script src="/static/js/i18n.js?v=3"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="brand-mark">
          <path d="M6 3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8" cy="13.5" r="1.4" fill="currentColor"/>
          <circle cx="16" cy="13.5" r="1.4" fill="currentColor"/>
          <path d="M7 17l-2 3M17 17l2 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Rail<strong>Setu</strong></span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link" data-i18n="nav.search">Search</a>
        <a href="/status/" class="nav-link" data-i18n="nav.status">Live status</a>
        <a href="/board/" class="nav-link" data-i18n="nav.board">Station board</a>
        <a href="/coaches/" class="nav-link" data-i18n="nav.coaches">Coaches</a>
        <a href="/predict/" class="nav-link" data-i18n="nav.predict">Predict</a>
        <a href="/pnr/" class="nav-link" id="pnr-link">Check PNR</a>
        <a href="/dashboard/" class="nav-link" id="nav-dash" hidden>Dashboard</a>
        <select class="lang-select" id="lang-select" aria-label="Language"></select>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme"><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <a href="/login/" class="btn-ghost" id="signin-link">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="wrap train-wrap">
    <a href="/" class="back-link">&lsaquo; Back to search</a>

    <div class="state" id="td-loading">Loading schedule&hellip;</div>
    <div class="state" id="td-error" hidden></div>

    <article id="td-card" hidden>
      <header class="td-head">
        <div>
          <h1 class="td-title"><span id="td-number"></span> &middot; <span id="td-name"></span></h1>
          <p class="td-route" id="td-route"></p>
        </div>
        <div class="td-meta">
          <span class="td-type" id="td-type" hidden></span>
          <button type="button" class="td-book" id="td-book" hidden>Book this journey &rsaquo;</button>
          <button type="button" class="td-save" id="td-save" aria-pressed="false" hidden>☆ Save</button>
          <button type="button" class="td-live" id="td-live">Live status &rsaquo;</button>
          <button type="button" class="td-pdf" id="td-pdf">Download schedule</button>
        </div>
      </header>

      <section class="td-runs">
        <span class="td-runs-label">Runs on</span>
        <span class="td-days" id="td-days"></span>
      </section>

      <section class="td-delay" id="td-delay" hidden></section>

      <div class="td-quota" id="td-quota" hidden>
        <span class="td-quota-lbl">Quota</span>
        <button type="button" class="td-quota-btn is-on" data-q="GN">General</button>
        <button type="button" class="td-quota-btn" data-q="TQ">Tatkal</button>
      </div>

      <section class="td-avail" id="td-avail" hidden></section>

      <section class="td-alert" id="td-alert" hidden>
        <h2>Set a price or seat alert</h2>
        <div class="al-form">
          <label class="al-fld">
            <span>Notify me when</span>
            <select id="al-kind">
              <option value="seat">a seat clears (becomes available)</option>
              <option value="fare">the fare drops to or below</option>
            </select>
          </label>
          <label class="al-fld" id="al-thr-wrap" hidden>
            <span>Target fare (₹)</span>
            <input type="number" id="al-threshold" min="1" step="5" placeholder="e.g. 1200">
          </label>
          <label class="al-fld">
            <span>Class</span>
            <select id="al-class"></select>
          </label>
          <button type="button" class="al-create" id="al-create">Create alert</button>
        </div>
        <p class="al-msg" id="al-msg" hidden></p>
        <div class="al-mine" id="al-mine"></div>
      </section>

      <section class="td-week" id="td-week" hidden></section>

      <section class="td-trends" id="td-trends" hidden>
        <h2>Trends</h2>
        <div class="tr-grid">
          <div class="tr-card" id="td-trend-fare"></div>
          <div class="tr-card" id="td-trend-delay"></div>
        </div>
        <p class="tr-note">Indicative, from RailSetu's fare estimate and delay model.</p>
      </section>

      <section class="td-coach" id="td-coach" hidden></section>

      <section class="td-schedule">
        <div class="td-sched-head">
          <span>Station</span>
          <span class="num">Arrives</span>
          <span class="num">Departs</span>
          <span class="num">Day</span>
          <span class="num">Est. delay</span>
        </div>
        <ol class="td-stops" id="td-stops"></ol>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="brand small">Rail<strong>Setu</strong></span>
    </div>
  </footer>

  <script src="/static/js/auth.js?v=2"></script>
  <script src="/static/js/saved.js?v=1"></script>
  <script src="/static/js/alerts.js?v=1"></script>
  <script src="/static/js/history.js?v=1"></script>
  <script src="/static/js/train.js?v=13"></script>
  <script src="/static/js/chatbot.js?v=9"></script>
</body>
</html>
