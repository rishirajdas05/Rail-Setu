databases:
  - name: railsetu-db
    plan: free
    databaseName: railsetu
    user: railsetu

services:
  - type: web
    name: railsetu
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railsetu-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "0"

      - key: WEB_CONCURRENCY
        value: "4"

      - key: DJANGO_SSL_REDIRECT
        value: "1"

      - key: GROQ_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: LIVE_API_KEY
        sync: false